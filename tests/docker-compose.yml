services:
  node1:
    image: ubuntu
    networks:
        my_network:
          ipv4_address: 172.25.0.10

  node2:
    image: ubuntu
    networks:
        my_network:
          ipv4_address: 172.25.0.11

  node3:
    image: ubuntu
    networks:
        my_network:
          ipv4_address: 172.25.0.12

networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
